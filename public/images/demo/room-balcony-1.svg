<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Wall & Floor -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>
  <rect y="400" width="800" height="100" fill="#94a3b8"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#64748b" stroke-width="4"/>

  <!-- Interior Elements -->
  
      <!-- Open Balcony Railing -->
      <rect x="60" y="260" width="680" height="14" rx="4" fill="#334155"/>
      <line x1="60" y1="274" x2="740" y2="274" stroke="#64748b" stroke-width="3"/>
      <line x1="100" y1="274" x2="100" y2="395" stroke="#475569" stroke-width="6"/><line x1="150" y1="274" x2="150" y2="395" stroke="#475569" stroke-width="6"/><line x1="200" y1="274" x2="200" y2="395" stroke="#475569" stroke-width="6"/><line x1="250" y1="274" x2="250" y2="395" stroke="#475569" stroke-width="6"/><line x1="300" y1="274" x2="300" y2="395" stroke="#475569" stroke-width="6"/><line x1="350" y1="274" x2="350" y2="395" stroke="#475569" stroke-width="6"/><line x1="400" y1="274" x2="400" y2="395" stroke="#475569" stroke-width="6"/><line x1="450" y1="274" x2="450" y2="395" stroke="#475569" stroke-width="6"/><line x1="500" y1="274" x2="500" y2="395" stroke="#475569" stroke-width="6"/><line x1="550" y1="274" x2="550" y2="395" stroke="#475569" stroke-width="6"/><line x1="600" y1="274" x2="600" y2="395" stroke="#475569" stroke-width="6"/><line x1="650" y1="274" x2="650" y2="395" stroke="#475569" stroke-width="6"/><line x1="700" y1="274" x2="700" y2="395" stroke="#475569" stroke-width="6"/>
      <rect x="60" y="395" width="680" height="25" fill="#1e293b"/>

      <!-- Bihar City Skyline in Background -->
      <rect x="120" y="130" width="60" height="130" fill="#94a3b8" opacity="0.5"/>
      <rect x="210" y="90" width="80" height="170" fill="#64748b" opacity="0.6"/>
      <rect x="320" y="150" width="70" height="110" fill="#94a3b8" opacity="0.5"/>
      <rect x="420" y="110" width="90" height="150" fill="#475569" opacity="0.6"/>
      <rect x="540" y="140" width="80" height="120" fill="#94a3b8" opacity="0.5"/>
      <circle cx="670" cy="90" r="35" fill="#fef08a" opacity="0.8"/>

      <!-- Balcony Coffee Chairs -->
      <rect x="230" y="290" width="50" height="60" rx="8" fill="#0f5c65"/>
      <rect x="330" y="290" width="50" height="60" rx="8" fill="#0f5c65"/>
      <ellipse cx="305" cy="325" rx="20" ry="10" fill="#78350f"/>
    

  <!-- Top Title Badge -->
  <g filter="url(#shadow)">
    <rect x="40" y="30" width="360" height="70" rx="12" fill="#0f242a" opacity="0.9"/>
    <rect x="40" y="30" width="8" height="70" rx="4" fill="#eab308"/>
    <text x="65" y="60" fill="#ffffff" font-size="20" font-weight="700" font-family="'Segoe UI', -apple-system, sans-serif">Open Balcony View</text>
    <text x="65" y="82" fill="#94a3b8" font-size="13" font-family="'Segoe UI', -apple-system, sans-serif">Fresh air with city skyline</text>
  </g>

  <!-- Tag Pill -->
  <g>
    <rect x="650" y="30" width="110" height="34" rx="17" fill="#0f5c65"/>
    <text x="705" y="52" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700" font-family="'Segoe UI', sans-serif">BALCONY</text>
  </g>
</svg>